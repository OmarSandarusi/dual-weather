<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16263d">
<meta name="description" content="Weather with °C and °F side by side, everywhere.">
<title>Dual Weather</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg1: #16263d; --bg2: #2d4a73;
    --text: #f7f9fc; --muted: rgba(247,249,252,.82);
    --card: rgba(10,20,38,.46); --card-strong: rgba(255,255,255,.24);
    --line: rgba(255,255,255,.2);
    --c: #ffffff;            /* Celsius colour */
    --f: #ffc27a;            /* Fahrenheit colour */
    --radius: 26px;
    color-scheme: dark;
  }
  body[data-sky="clear-day"]   { --bg1:#1f5fc4; --bg2:#4f93de; }
  body[data-sky="clear-night"] { --bg1:#0b1330; --bg2:#27345f; }
  body[data-sky="cloud"]       { --bg1:#3d4d63; --bg2:#66798f; }
  body[data-sky="fog"]         { --bg1:#4d5863; --bg2:#79858f; }
  body[data-sky="rain"]        { --bg1:#27384f; --bg2:#4f6a8a; }
  body[data-sky="snow"]        { --bg1:#3f5879; --bg2:#7f98ba; }
  body[data-sky="storm"]       { --bg1:#1c2033; --bg2:#473f66; }

  html { font-size: 14px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    font-family: "Google Sans", "Product Sans", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: linear-gradient(170deg, var(--bg1), var(--bg2)) fixed;
    transition: background .6s;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  main { max-width: 640px; margin: 0 auto; padding: 4px 14px 32px; }

  /* top bar */
  .bar { display:flex; align-items:center; gap:8px; padding: 6px 0 2px; }
  .bar h1 { flex:1; margin:0; font-size:1.1rem; font-weight:500; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icon-btn { width:40px; height:40px; border-radius:50%; border:0; background:var(--card); display:grid; place-items:center; font-size:1.2rem; }
  .icon-btn:active { background: var(--card-strong); }
  .icon-btn.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* hero */
  .hero { text-align:center; padding: 8px 0 4px; }
  .hero .emoji { font-size: 3.4rem; line-height:1; }
  .hero .selday { font-size:.95rem; color:var(--muted); margin-top:8px; }
  .hero .cond { font-size:1.1rem; margin-top:4px; color: var(--muted); }
  .big { display:flex; justify-content:center; align-items:baseline; gap: 14px; margin-top: 6px; }
  .big .t { display:flex; align-items:flex-start; line-height:.95; }
  .big .t b { font-size: 4.6rem; font-weight: 300; letter-spacing:-2px; }
  .big .t i { font-style:normal; font-size:1.5rem; margin:6px 0 0 3px; opacity:.95; }
  .big .t.c { color: var(--c); }
  .big .t.f { color: var(--f); }
  .big .sep { font-size: 2.4rem; font-weight:200; opacity:.45; align-self:center; }
  .hilo { margin-top: 6px; display:flex; flex-direction:column; gap:2px; color: var(--muted); font-size:1rem; }

  /* generic dual readout */
  .d { white-space: nowrap; }
  .d .c { color: var(--c); }
  .d .f { color: var(--f); }
  .d .s { opacity:.4; margin: 0 .25em; }

  .card, .tile { border:1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px 14px 10px; margin-top: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .card h2 { margin:0 0 6px; font-size:.78rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }

  /* hourly */
  .hours { display:flex; gap:2px; overflow-x:auto; margin: 0 -6px; padding: 0 6px 4px; scroll-snap-type:x proximity; }
  .hour { flex: 0 0 58px; text-align:center; scroll-snap-align:start; padding: 4px 0; }
  .hour .time { font-size:.82rem; color:var(--muted); }
  .hour .ic { font-size:1.6rem; margin:4px 0 2px; }
  .hour .tc { font-size:1.05rem; font-weight:600; color:var(--c); }
  .hour .tf { font-size:.95rem; color:var(--f); }
  .hour .pp { font-size:.75rem; color:#9fd0ff; margin-top:4px; min-height:1em; }
  .hour .pp.lo { opacity:.5; }
  .hour .amt { display:flex; flex-direction:column; font-size:.72rem; min-height:2.3em; margin-top:2px; }
  .hour .amt .c { color:var(--c); } .hour .amt .f { color:var(--f); }
  #hourlyCard { scroll-margin-top: 8px; }

  /* daily */
  .days { display:flex; gap:8px; overflow-x:auto; margin:0 -6px; padding:2px 6px 8px; scroll-snap-type:x proximity; }
  .day { flex:0 0 74px; scroll-snap-align:start; display:flex; flex-direction:column; align-items:center; text-align:center;
         padding:10px 4px 10px; border-radius:24px; background:rgba(255,255,255,.08); border:1px solid var(--line);
         cursor:pointer; font-variant-numeric: tabular-nums; transition: background .15s, border-color .15s; }
  .day.sel { background:rgba(255,255,255,.3); border-color:rgba(255,255,255,.75); box-shadow:0 4px 12px rgba(0,0,0,.25); }
  .day:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  .day .name { font-weight:600; font-size:.95rem; }
  .day .ic { font-size:1.7rem; margin:6px 0 0; }
  .day .pp { font-size:.72rem; color:#9fd0ff; height:1.5em; line-height:1.5em; margin-bottom:4px; }
  .day .tc { font-size:1.05rem; font-weight:600; color:var(--c); }
  .day .tf { font-size:.95rem; color:var(--f); }
  .day .rule { width:56%; height:1px; background:var(--line); margin:7px 0 6px; }
  .day .lo { opacity:.72; }

  /* details */
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:12px; }
  .tile { background:var(--card); border-radius:22px; padding:12px 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .tile.wide { grid-column: span 2; }
  .tile .v .s { opacity:.4; }
  .tile h3 { margin:0 0 4px; font-size:.75rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .tile .v { font-size:1.15rem; line-height:1.3; }
  .tile .v div { display:flex; align-items:baseline; gap:6px; }
  .tile .v .c { color:var(--c); } .tile .v .f { color:var(--f); }
  .tile .v .u { font-size:.8rem; opacity:.7; }

  .foot { text-align:center; color:var(--muted); font-size:.75rem; margin-top:22px; }
  .banner { background:rgba(255,200,100,.18); border:1px solid rgba(255,200,100,.4); border-radius:14px; padding:8px 12px; margin-top:12px; font-size:.85rem; display:none; }
  .banner.on { display:block; }

  /* empty / welcome */
  .welcome { text-align:center; padding: 80px 16px; }
  .welcome .emoji { font-size:4rem; }
  .welcome p { color:var(--muted); }
  .btn { background:var(--card-strong); border:0; border-radius:999px; padding:12px 20px; font-weight:500; margin:6px; }
  .btn.primary { background:#fff; color:#16263d; }

  /* sheet */
  dialog { border:0; padding:0; background:transparent; color:var(--text); width:100%; max-width:640px; margin:auto auto 0; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  .sheet { background:#1b2a42; border-radius: 28px 28px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); max-height: 85dvh; overflow:auto; }
  .sheet h2 { margin:0 0 12px; font-size:1.1rem; font-weight:500; display:flex; justify-content:space-between; align-items:center; }
  .search { width:100%; padding:14px 16px; border-radius:16px; border:1px solid var(--line); background:rgba(255,255,255,.08); color:var(--text); font:inherit; }
  .search::placeholder { color: var(--muted); }
  .row { display:flex; align-items:center; gap:10px; padding:12px 4px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .main { flex:1; min-width:0; text-align:left; background:none; border:0; padding:0; }
  .row .nm { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .sub { font-size:.8rem; color:var(--muted); }
  .row .del { background:none; border:0; opacity:.6; font-size:1.1rem; padding:8px; }
  .row.cur .nm::before { content:"● "; color:#7ee787; }
  .results { margin-top:8px; }
  .hint { color:var(--muted); font-size:.85rem; padding:10px 4px; }
</style>
</head>
<body data-sky="clear-day">
<main>
  <div class="bar">
    <button class="icon-btn" id="openLoc" aria-label="Locations">📍</button>
    <h1 id="place">Dual Weather</h1>
    <button class="icon-btn" id="refresh" aria-label="Refresh">⟳</button>
  </div>
  <div class="banner" id="banner"></div>
  <div id="view"></div>
  <div class="foot">Data by Open-Meteo.com · °F is converted from the same reading as °C</div>
</main>

<dialog id="sheet">
  <div class="sheet">
    <h2><span>Locations</span><button class="icon-btn" id="closeLoc" aria-label="Close">✕</button></h2>
    <input class="search" id="q" type="search" placeholder="Search for a city…" autocomplete="off">
    <div class="results" id="results"></div>
    <div style="margin:10px 0 6px"><button class="btn" id="geo">📡 Use my current location</button></div>
    <div id="saved"></div>
  </div>
</dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

/* ---------- unit helpers: always derive both from the raw °C value ---------- */
const toF  = c => c * 9 / 5 + 32;
const toMph = k => k * 0.621371;
const r = n => Math.round(n) + 0;            // "+0" turns -0 into 0
const dual = c => `<span class="d"><span class="c">${r(c)}°C</span><span class="s">/</span><span class="f">${r(toF(c))}°F</span></span>`;
const dualStack = c => `<div><span class="c">${r(c)}°C</span></div><div><span class="f">${r(toF(c))}°F</span></div>`;

/* ---------- weather code → label / emoji / sky ---------- */
function describe(code, day) {
  const m = {
    0:  ['Clear',            day ? '☀️' : '🌙', day ? 'clear-day' : 'clear-night'],
    1:  ['Mostly clear',     day ? '🌤️' : '🌙', day ? 'clear-day' : 'clear-night'],
    2:  ['Partly cloudy',    day ? '⛅' : '☁️', 'cloud'],
    3:  ['Overcast',         '☁️', 'cloud'],
    45: ['Fog',              '🌫️', 'fog'], 48: ['Freezing fog', '🌫️', 'fog'],
    51: ['Light drizzle',    '🌦️', 'rain'], 53: ['Drizzle', '🌦️', 'rain'], 55: ['Heavy drizzle', '🌧️', 'rain'],
    56: ['Freezing drizzle', '🌧️', 'rain'], 57: ['Freezing drizzle', '🌧️', 'rain'],
    61: ['Light rain',       '🌦️', 'rain'], 63: ['Rain', '🌧️', 'rain'], 65: ['Heavy rain', '🌧️', 'rain'],
    66: ['Freezing rain',    '🌧️', 'rain'], 67: ['Freezing rain', '🌧️', 'rain'],
    71: ['Light snow',       '🌨️', 'snow'], 73: ['Snow', '❄️', 'snow'], 75: ['Heavy snow', '❄️', 'snow'],
    77: ['Snow grains',      '🌨️', 'snow'],
    80: ['Light showers',    '🌦️', 'rain'], 81: ['Showers', '🌧️', 'rain'], 82: ['Heavy showers', '🌧️', 'rain'],
    85: ['Snow showers',     '🌨️', 'snow'], 86: ['Heavy snow showers', '❄️', 'snow'],
    95: ['Thunderstorm',     '⛈️', 'storm'], 96: ['Thunderstorm, hail', '⛈️', 'storm'], 99: ['Thunderstorm, hail', '⛈️', 'storm']
  };
  return m[code] || ['—', '🌡️', 'cloud'];
}

/* ---------- state ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let locations = store.get('locations', []);
let currentIdx = Math.min(store.get('currentIdx', 0), Math.max(0, locations.length - 1));
let lastLoaded = 0;

const key = l => `wx2:${l.lat.toFixed(2)},${l.lon.toFixed(2)}`;

/* ---------- data ---------- */
async function fetchWeather(l) {
  const u = new URL('https://api.open-meteo.com/v1/forecast');
  u.search = new URLSearchParams({
    latitude: l.lat, longitude: l.lon, timezone: 'auto', forecast_days: 10,
    wind_speed_unit: 'kmh', temperature_unit: 'celsius',
    current: 'temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,weather_code,is_day,wind_speed_10m,wind_gusts_10m',
    hourly: 'temperature_2m,precipitation_probability,precipitation,weather_code,is_day,relative_humidity_2m,dew_point_2m',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max,sunrise,sunset'
  });
  const res = await fetch(u);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  store.set(key(l), { t: Date.now(), data });
  return data;
}
const cached = l => store.get(key(l), null);

/* ---------- rendering ---------- */
const hourLabel = s => new Date(s).toLocaleTimeString('en-US', { hour: 'numeric', hour12: true });
const clock = s => new Date(s).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
const dayName = (s, i) => i === 0 ? 'Today' : new Date(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10)).toLocaleDateString([], { weekday: 'short' });

let selDay = 0;          // which day of the 10-day list is selected (0 = today)
let shown = null;        // { l, data } currently on screen, so a tap can re-render
let shownKey = null;

const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
const mm2in = v => (v / 25.4).toFixed(2);
const speed = k => `<div><span class="c">${r(k)}</span><span class="u">km/h</span></div><div><span class="f">${r(toMph(k))}</span><span class="u">mph</span></div>`;
const tile = (title, body, cls = '', style = '') => `<div class="tile ${cls}"><h3>${title}</h3><div class="v" ${style ? `style="${style}"` : ''}>${body}</div></div>`;

function render(l, data) {
  shown = { l, data };
  const prevDayScroll = document.querySelector('.days')?.scrollLeft || 0;
  const c = data.current, h = data.hourly, d = data.daily;
  if (selDay >= d.time.length) selDay = 0;
  const sel = selDay, today = sel === 0;

  // ----- which hours to list -----
  const idxs = [];
  if (today) {                                   // next 24 hours from now
    const nowHour = c.time.slice(0, 13);
    let start = h.time.findIndex(t => t.slice(0, 13) >= nowHour);
    if (start < 0) start = 0;
    for (let i = start; i < Math.min(start + 24, h.time.length); i++) idxs.push(i);
  } else {                                       // that calendar day, midnight to midnight
    h.time.forEach((t, i) => { if (t.startsWith(d.time[sel])) idxs.push(i); });
  }

  // ----- hero (big panel) -----
  const [label, emoji, sky] = today ? describe(c.weather_code, c.is_day) : describe(d.weather_code[sel], 1);
  document.body.dataset.sky = sky;
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.body).getPropertyValue('--bg1').trim();
  const bigC = today ? c.temperature_2m : d.temperature_2m_max[sel];
  const y = +d.time[sel].slice(0, 4), mo = +d.time[sel].slice(5, 7) - 1, dd = +d.time[sel].slice(8, 10);
  const dayTitle = new Date(y, mo, dd).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

  // ----- hourly -----
  const hours = idxs.map((i, n) => {
    const [, em] = describe(h.weather_code[i], h.is_day[i]);
    const pp = h.precipitation_probability[i];
    const mm = h.precipitation[i] || 0;
    return `<div class="hour">
      <div class="time">${today && n === 0 ? 'Now' : hourLabel(h.time[i])}</div>
      <div class="ic">${em}</div>
      <div class="tc">${r(h.temperature_2m[i])}°C</div>
      <div class="tf">${r(toF(h.temperature_2m[i]))}°F</div>
      <div class="pp ${pp >= 10 ? '' : 'lo'}">${pp == null ? '' : '💧' + pp + '%'}</div>
      <div class="amt">${mm >= 0.05 ? `<span class="c">${mm.toFixed(1)}mm</span><span class="f">${mm2in(mm)}in</span>` : ''}</div></div>`;
  }).join('');

  // ----- 10-day list -----
  const days = d.time.map((t, i) => {
    const [, em] = describe(d.weather_code[i], 1);
    const pp = d.precipitation_probability_max[i];
    const hi = d.temperature_2m_max[i], lo = d.temperature_2m_min[i];
    return `<div class="day ${i === sel ? 'sel' : ''}" data-day="${i}" role="button" tabindex="0" aria-pressed="${i === sel}"
        aria-label="${dayName(t, i)}, high ${r(hi)}°C ${r(toF(hi))}°F, low ${r(lo)}°C ${r(toF(lo))}°F">
      <div class="name">${dayName(t, i)}</div>
      <div class="ic">${em}</div>
      <div class="pp">${pp >= 10 ? '💧' + pp + '%' : ''}</div>
      <div class="tc">${r(hi)}°C</div><div class="tf">${r(toF(hi))}°F</div>
      <div class="rule"></div>
      <div class="lo"><div class="tc">${r(lo)}°C</div><div class="tf">${r(toF(lo))}°F</div></div></div>`;
  }).join('');

  // ----- detail tiles -----
  const chance = d.precipitation_probability_max[sel];
  const total = d.precipitation_sum[sel] || 0;
  const sun = tile('Sun', `🌅 ${clock(d.sunrise[sel])}<br>🌇 ${clock(d.sunset[sel])}`, '', 'font-size:1rem');
  const precip = tile(today ? 'Precipitation today' : 'Precipitation',
    `<div>${chance == null ? '—' : '💧 ' + chance + '% chance'}</div>
     <div><span class="c">${total.toFixed(1)}</span><span class="u">mm</span><span class="s">/</span><span class="f">${mm2in(total)}</span><span class="u">in</span></div>`, 'wide');
  let tiles;
  if (today) {
    tiles = [
      tile('Feels like', dualStack(c.apparent_temperature)),
      tile('Dew point', dualStack(c.dew_point_2m)),
      tile('Wind', speed(c.wind_speed_10m)),
      tile('Gusts', speed(c.wind_gusts_10m)),
      tile('Humidity', r(c.relative_humidity_2m) + '%'),
      sun, precip];
  } else {
    const dayIx = idxs;
    tiles = [
      tile('Feels like', `<div>H ${dual(d.apparent_temperature_max[sel])}</div><div>L ${dual(d.apparent_temperature_min[sel])}</div>`, '', 'font-size:1rem'),
      tile('Dew point (avg)', dualStack(avg(dayIx.map(i => h.dew_point_2m[i])))),
      tile('Wind (max)', speed(d.wind_speed_10m_max[sel])),
      tile('Gusts (max)', speed(d.wind_gusts_10m_max[sel])),
      tile('Humidity (avg)', r(avg(dayIx.map(i => h.relative_humidity_2m[i]))) + '%'),
      sun, precip];
  }

  $('#view').innerHTML = `
    <section class="hero">
      <div class="emoji">${emoji}</div>
      ${today ? '' : `<div class="selday">${esc(dayTitle)} · High</div>`}
      <div class="big">
        <div class="t c"><b>${r(bigC)}</b><i>°C</i></div>
        <div class="sep">/</div>
        <div class="t f"><b>${r(toF(bigC))}</b><i>°F</i></div>
      </div>
      <div class="cond">${esc(label)}</div>
      <div class="hilo">
        ${today ? `<div>High ${dual(d.temperature_2m_max[0])}</div>` : ''}
        <div>Low ${dual(d.temperature_2m_min[sel])}</div>
      </div>
    </section>

    <section class="card" id="hourlyCard"><h2>Hourly${today ? '' : ' · ' + dayName(d.time[sel], sel)}</h2><div class="hours">${hours}</div></section>

    <section class="card"><h2>10-day forecast</h2><div class="days">${days}</div></section>

    <div class="grid">${tiles.join('')}</div>`;
  const dayStrip = $('.days');                     // keep the day strip where the user had scrolled it
  if (dayStrip) dayStrip.scrollLeft = prevDayScroll;
}

// tap (or Enter/Space) on a day to make it the selected day
function pickDay(el) {
  const row = el.closest('[data-day]');
  if (!row || !shown) return;
  selDay = +row.dataset.day;
  render(shown.l, shown.data);
  const card = $('#hourlyCard');   // if the hourly strip was scrolled out of view, bring it back
  if (card && card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
$('#view').addEventListener('click', e => pickDay(e.target));
$('#view').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-day]')) { e.preventDefault(); pickDay(e.target); }
});

function showWelcome() {
  $('#place').textContent = 'Dual Weather';
  document.body.dataset.sky = 'clear-day';
  $('#view').innerHTML = `<div class="welcome">
    <div class="emoji">🌡️</div>
    <h2>°C and °F, side by side</h2>
    <p>Add a location to get started.</p>
    <button class="btn primary" onclick="openSheet()">Add a location</button>
    <button class="btn" onclick="useGeo()">Use my location</button></div>`;
}

function banner(msg) { const b = $('#banner'); b.textContent = msg || ''; b.classList.toggle('on', !!msg); }
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };

async function show(forceNetwork = true) {
  const l = locations[currentIdx];
  if (!l) return showWelcome();
  $('#place').textContent = l.name;
  if (key(l) !== shownKey) { selDay = 0; shownKey = key(l); }
  const c = cached(l);
  if (c) render(l, c.data);
  if (!forceNetwork && c && Date.now() - c.t < 10 * 60 * 1000) { banner(''); return; }
  $('#refresh').classList.add('spin');
  try {
    const data = await fetchWeather(l);
    render(l, data); lastLoaded = Date.now(); banner('');
  } catch (e) {
    banner(c ? `Offline — showing data from ${ago(c.t)}.` : 'Could not load weather. Check your connection.');
  } finally { $('#refresh').classList.remove('spin'); }
}

/* ---------- locations sheet ---------- */
const sheet = $('#sheet');
function openSheet() { sheet.showModal(); renderSaved(); }
window.openSheet = openSheet;
$('#openLoc').onclick = openSheet;
$('#closeLoc').onclick = () => sheet.close();
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });

async function renderSaved() {
  const box = $('#saved');
  if (!locations.length) { box.innerHTML = '<div class="hint">No saved locations yet.</div>'; return; }
  box.innerHTML = locations.map((l, i) => {
    const c = cached(l);
    const now = c ? `${describe(c.data.current.weather_code, c.data.current.is_day)[1]} ${dual(c.data.current.temperature_2m)}` : '…';
    return `<div class="row ${i === currentIdx ? 'cur' : ''}">
      <button class="main" data-pick="${i}"><div class="nm">${esc(l.name)}</div><div class="sub" data-now="${i}">${now}</div></button>
      <button class="del" data-del="${i}" aria-label="Remove ${esc(l.name)}">🗑</button></div>`;
  }).join('');
  // refresh every saved location's current temp in the background
  locations.forEach(async (l, i) => {
    try {
      const data = await fetchWeather(l);
      const el = box.querySelector(`[data-now="${i}"]`);
      if (el) el.innerHTML = `${describe(data.current.weather_code, data.current.is_day)[1]} ${dual(data.current.temperature_2m)}`;
    } catch {}
  });
}
$('#saved').addEventListener('click', e => {
  const pick = e.target.closest('[data-pick]'), del = e.target.closest('[data-del]');
  if (pick) { currentIdx = +pick.dataset.pick; store.set('currentIdx', currentIdx); sheet.close(); show(false); }
  if (del) {
    const i = +del.dataset.del;
    locations.splice(i, 1);
    if (currentIdx >= locations.length) currentIdx = Math.max(0, locations.length - 1);
    store.set('locations', locations); store.set('currentIdx', currentIdx);
    renderSaved(); show(false);
  }
});

function addLocation(loc) {
  const i = locations.findIndex(x => Math.abs(x.lat - loc.lat) < .02 && Math.abs(x.lon - loc.lon) < .02);
  if (i >= 0) currentIdx = i; else { locations.push(loc); currentIdx = locations.length - 1; }
  store.set('locations', locations); store.set('currentIdx', currentIdx);
  sheet.close(); $('#q').value = ''; $('#results').innerHTML = ''; show();
}

let searchTimer;
$('#q').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { $('#results').innerHTML = ''; return; }
  searchTimer = setTimeout(async () => {
    try {
      const res = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=en&name=' + encodeURIComponent(q));
      const j = await res.json();
      const list = j.results || [];
      $('#results').innerHTML = list.length ? list.map((p, i) => {
        const sub = [p.admin1, p.country].filter(Boolean).join(', ');
        return `<div class="row"><button class="main" data-r="${i}"><div class="nm">${esc(p.name)}</div><div class="sub">${esc(sub)}</div></button></div>`;
      }).join('') : '<div class="hint">No matches.</div>';
      $('#results').onclick = ev => {
        const b = ev.target.closest('[data-r]'); if (!b) return;
        const p = list[+b.dataset.r];
        addLocation({ name: [p.name, p.admin1].filter(Boolean).join(', '), lat: p.latitude, lon: p.longitude });
      };
    } catch { $('#results').innerHTML = '<div class="hint">Search failed — are you online?</div>'; }
  }, 300);
});

function useGeo() {
  if (!navigator.geolocation) { banner('Location is not available in this browser.'); return; }
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    let name = 'Current location';
    try {   // reverse-lookup the nearest place name (Open-Meteo has no reverse API; BigDataCloud's free client endpoint does)
      const j = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`)).json();
      name = [j.city || j.locality, j.principalSubdivision].filter(Boolean).join(', ') || name;
    } catch {}
    addLocation({ name, lat, lon });
  }, () => banner('Could not get your location — allow location access, or search for a city.'),
  { timeout: 10000, maximumAge: 300000 });
}
window.useGeo = useGeo;
$('#geo').onclick = () => { sheet.close(); useGeo(); };

/* ---------- misc ---------- */
$('#refresh').onclick = () => show(true);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && locations.length && Date.now() - lastLoaded > 10 * 60 * 1000) show(true);
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

show();
</script>
</body>
</html>
